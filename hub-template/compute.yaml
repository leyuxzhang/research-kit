  queue: default
  resources: "/nodes=1/gpu=1"   # check your site's syntax (some use host=1/gpu=1)
  gpu_property: ""              # e.g. "gpu_model='A100'" — empty for any GPU
  walltime: "12:00:00"
  env_setup: |
    # TODO, e.g.:
    # source ~/miniconda3/etc/profile.d/conda.sh
